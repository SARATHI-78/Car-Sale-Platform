name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Firebase config exists for build
        run: |
          if [ ! -f firebase-applet-config.json ]; then
            cat << 'EOF' > firebase-applet-config.json
          {
            "projectId": "mindful-router-761jg",
            "appId": "1:263446757330:web:13b7a2ba81d0282a8cd20b",
            "apiKey": "AIzaSyARJOFr_IbONXTxWTYJMqhid4tM_pE1VMc",
            "authDomain": "mindful-router-761jg.firebaseapp.com",
            "firestoreDatabaseId": "ai-studio-b6b20236-d223-4a50-9b9f-0be1649746b1",
            "storageBucket": "mindful-router-761jg.firebasestorage.app",
            "messagingSenderId": "263446757330",
            "measurementId": "",
            "oAuthClientId": "263446757330-p9ub717n1ie6sed0klfodmr9aulf7ja5.apps.googleusercontent.com",
            "recaptchaSiteKey": ""
          }
          EOF
          fi

      - name: Build production bundle
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '' }}/
        run: npm run build

      - name: Prepare static assets and SPA fallback for GitHub Pages
        run: |
          mkdir -p dist/src/assets/images
          cp -r src/assets/images/* dist/src/assets/images/ 2>/dev/null || true
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
