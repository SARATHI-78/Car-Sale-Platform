name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: TypeScript & Firestore Security Rules Validation
        run: |
          npm run lint
          npx eslint firestore.rules

      - name: Build production bundle
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Prepare static assets and SPA fallback for GitHub Pages
        run: |
          mkdir -p dist/src/assets/images
          cp -r src/assets/images/* dist/src/assets/images/ 2>/dev/null || true
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
